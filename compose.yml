services:
  app:
    build:
      context: .
      target: production
    container_name: drop
    environment:
      NODE_ENV: production
      LANCEDB_PATH: /data/lancedb
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - drop_lancedb:/data/lancedb
    restart: unless-stopped

  app-dev:
    profiles:
      - development
    build:
      context: .
      target: dev
    container_name: drop-dev
    command: npm run dev
    environment:
      NODE_ENV: development
      LANCEDB_PATH: /data/lancedb
      CHOKIDAR_USE_POLLING: "true"
      VITE_USE_POLLING: "true"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - drop_node_modules:/app/node_modules
      - drop_lancedb_dev:/data/lancedb
    stdin_open: true
    tty: true

volumes:
  drop_lancedb:
  drop_node_modules:
  drop_lancedb_dev:
