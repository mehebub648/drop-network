services:
  app:
    build:
      context: .
      target: production
    container_name: drop
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://site-21000.91.108.104.57.mehebub.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LANCEDB_PATH: /data/lancedb
      COMMUNITY_MEDIA_PATH: /data/media/community
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      SMS_HTTP_ENDPOINT: ${SMS_HTTP_ENDPOINT:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      DONATION_INTERVAL_DAYS: ${DONATION_INTERVAL_DAYS:-120}
      AVAILABILITY_TTL_DAYS: ${AVAILABILITY_TTL_DAYS:-14}
      MATCH_RADIUS_KM: ${MATCH_RADIUS_KM:-250}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Bind mount rather than a named volume so the datastore is a directory
      # you can back up, copy, or inspect directly on the host.
      - ./data/lancedb:/data/lancedb
      - ./data/media/community:/data/media/community
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  app-dev:
    profiles:
      - development
    build:
      context: .
      target: dev
    container_name: drop-dev
    command: npm run dev
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:3001}
      LANCEDB_PATH: /data/lancedb
      COMMUNITY_MEDIA_PATH: /data/media/community
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_BASE_URL: ${SMS_API_BASE_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      SMS_HTTP_ENDPOINT: ${SMS_HTTP_ENDPOINT:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      DONATION_INTERVAL_DAYS: ${DONATION_INTERVAL_DAYS:-120}
      AVAILABILITY_TTL_DAYS: ${AVAILABILITY_TTL_DAYS:-14}
      MATCH_RADIUS_KM: ${MATCH_RADIUS_KM:-250}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CHOKIDAR_USE_POLLING: "true"
      VITE_USE_POLLING: "true"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - drop_node_modules:/app/node_modules
      # Development keeps its own directory so experiments never touch the
      # production datastore.
      - ./data/lancedb-dev:/data/lancedb
      - ./data/media-dev/community:/data/media/community
    stdin_open: true
    tty: true

volumes:
  # LanceDB now lives in ./data on the host; only the dependency cache still
  # needs a named volume (it must not shadow the host node_modules).
  drop_node_modules:
